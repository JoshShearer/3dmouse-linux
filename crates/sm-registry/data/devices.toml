# 3DMouse Linux hardware registry (SRS §2.2, FR-101, §4.4).
#
# Every entry is an EXACT vid/pid on an exact transport. Do not infer one
# model's support from another revision or transport.
#
# status: unknown | detected | axis_verified | buttons_verified |
#         outputs_verified | full_verified | partial | blocked
#
# `source` records where the id/mapping came from; `evidence` points at the
# physical test record under docs/compatibility/evidence/ (empty = none).
#
# canonical: transform from the HID device frame to the spacenavd/libspnav
#   canonical frame. "swap_yz_inv_yz" == spacenavd DF_SWAPYZ|DF_INVYZ.
# buttons: `code` is the Linux evdev key code (BTN_0 = 256). `index` is the
#   logical button number exposed to libspnav clients and profiles.
#   `hid_bit` is the bit position inside the HID button report (report id 3)
#   when the hidraw path is used.
# spnav_type: SPNAV_DEV_* value from libspnav spnav.h.

