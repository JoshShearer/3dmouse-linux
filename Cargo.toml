[workspace]
resolver = "2"
members = [
    "crates/sm-core",
    "crates/sm-registry",
    "crates/sm-hid",
    "crates/sm-pipeline",
    "crates/sm-profile",
    "crates/sm-actions",
    "crates/sm-spnav",
    "crates/sm-desktop",
    "crates/sm-ipc",
    "crates/sm-daemon",
    "crates/sm-agent",
    "crates/sm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
proptest = "1"
# linear-time matching (no backtracking), so user/imported title patterns cannot hang the agent
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
sm-core = { path = "crates/sm-core" }
sm-registry = { path = "crates/sm-registry" }
sm-hid = { path = "crates/sm-hid" }
sm-pipeline = { path = "crates/sm-pipeline" }
sm-profile = { path = "crates/sm-profile" }
sm-actions = { path = "crates/sm-actions" }
sm-spnav = { path = "crates/sm-spnav" }
sm-desktop = { path = "crates/sm-desktop" }
sm-ipc = { path = "crates/sm-ipc" }
sm-daemon = { path = "crates/sm-daemon" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
