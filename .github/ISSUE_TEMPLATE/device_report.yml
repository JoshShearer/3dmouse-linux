name: Device report
description: Tell us how a 3Dconnexion device behaves (works, partly works, or not detected)
labels: [device]
body:
  - type: markdown
    attributes:
      value: |
        Only one device (the SpaceMouse Compact) is verified so far, so reports for any other
        model are very welcome, including "it works". See `tests/hardware/README.md` for the
        guided test.
  - type: input
    id: model
    attributes:
      label: Model and USB ID (`lsusb`)
      placeholder: e.g. SpaceMouse Pro Wireless 256f:c652 (receiver)
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Connection
      options: [USB cable, USB receiver, Bluetooth]
    validations:
      required: true
  - type: textarea
    id: inspect
    attributes:
      label: Output of `3dmousectl devices inspect <vid:pid>`
      render: text
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: What works and what doesn't
      description: Axes (`3dmousectl monitor`), each button, and any app you tried
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Version, distribution and desktop
    validations:
      required: true
